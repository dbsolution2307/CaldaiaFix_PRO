<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CaldaiaFix PRO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>
<body>

    <!-- INTESTAZIONE -->
    <header class="header">
        <div class="header-top">
            <h1 class="logo" onclick="tornaHome()">🔥 CaldaiaFix <span class="badge-pro">PRO</span></h1>
            <span id="netStatus" class="net-badge online">🟢 Online</span>
        </div>
        <p id="sub-header-count" class="sub-header">Diagnostica & Parametri HVAC (Caricamento...)</p>
    </header>

    <!-- VISTA PRINCIPALE (HOME) -->
    <main id="home-view" class="view active">
        <!-- BARRA RICERCA & VOCALE -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cerca codice o descrizione..." oninput="filtraErrori(false)">
            <button id="micBtn" class="mic-btn" onclick="avviaRicercaVocale()">🎙️</button>
        </div>

        <!-- FILTRO MARCA -->
        <div class="filter-box">
            <select id="brandFilter" onchange="filtraErrori(false)">
                <option value="">Tutte le marche</option>
                <option value="Baxi">Baxi</option>
                <option value="Vaillant">Vaillant</option>
                <option value="Immergas">Immergas</option>
                <option value="Ariston">Ariston</option>
                <option value="Beretta">Beretta</option>
                <option value="Ferroli">Ferroli</option>
                <option value="Hermann Saunier Duval">Hermann Saunier Duval</option>
                <option value="Riello">Riello</option>
                <option value="Bosch">Bosch / Junkers</option>
                <option value="Biasi">Biasi</option>
                <option value="Cosmogas">Cosmogas</option>
                <option value="Unical">Unical</option>
                <option value="Viessmann">Viessmann</option>
                <option value="Sime">Sime</option>
                <option value="Italtherm">Italtherm</option>
                <option value="Chaffoteaux">Chaffoteaux</option>
                <option value="Lamborghini">Lamborghini</option>
                <option value="Buderus">Buderus</option>
                <option value="Wolf">Wolf</option>
                <option value="Silber">Silber</option>
                <option value="Climatizzatori">Climatizzatori (Daikin/LG/Mitsu/ecc)</option>
            </select>
        </div>

        <!-- TAB FILTRI TIPO -->
        <div class="tabs">
            <button id="btn-all" class="tab-btn active" onclick="filtraTipo('all')">Tutti</button>
            <button id="btn-dig" class="tab-btn" onclick="filtraTipo('digital')">Digitali</button>
            <button id="btn-led" class="tab-btn" onclick="filtraTipo('led')">LED</button>
            <button id="btn-fav" class="tab-btn" onclick="filtraTipo('fav')">★ Preferiti</button>
        </div>

        <div id="resultsCount" class="results-count">0 GUASTI TROVATI</div>

        <!-- LISTA ERRORI -->
        <div id="errors-list" class="errors-container"></div>
    </main>

    <!-- VISTA DETTAGLIO GUASTO -->
    <section id="detail-view" class="view">
        <button class="back-btn" onclick="tornaHome()">⬅ Torna alla ricerca</button>
        <div id="detail-content"></div>
    </section>

    <!-- VISTA STORICO CONSULTAZIONI -->
    <section id="history-view" class="view">
        <div class="view-header">
            <h2>📜 Storico Recenti</h2>
            <button class="btn-clear" onclick="richiediSvuotaStorico()">Svuota</button>
        </div>
        <div id="history-list"></div>
    </section>

    <!-- VISTA ARCHIVIO TARGHE -->
    <section id="targhe-view" class="view">
        <div class="view-header">
            <h2>📑 Archivio Targhe Impianti</h2>
            <button class="btn-action" onclick="apriTargaModal()">+ Nuova Targa</button>
        </div>
        <div id="targhe-list"></div>
        <button class="btn-clear" style="margin-top:20px; width:100%;" onclick="richiediSvuotaTarghe()">Cancella Tutto l'Archivio</button>
    </section>

    <!-- VISTA CALCOLATORI TECNICI -->
    <section id="calc-view" class="view">
        <div class="view-header">
            <h2>🧮 Calcolatori Tecnici HVAC</h2>
        </div>

        <!-- CALCOLO PORTATA GAS -->
        <div class="card">
            <h3>🔥 Calcolo Portata Gas (
